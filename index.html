<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flying Bat Animation</title>
  <style>

    /* ============================================
       RESET
       Remove default browser margin/padding
    ============================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ============================================
       PAGE — Night sky
    ============================================ */
    body {
      background: #0a0a1a;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      cursor: pointer;
      transition: background 0.8s;
    }

    body.day {
      background: #87CEEB;
    }

    /* ============================================
       MOON
    ============================================ */
    .moon {
      position: absolute;
      top: 60px;
      right: 120px;
      width: 80px;
      height: 80px;
      background: #fffde7;
      border-radius: 50%;
      box-shadow: 0 0 30px 10px rgba(255, 253, 200, 0.4);
      transition: opacity 0.8s;
    }

    body.day .moon {
      opacity: 0;
    }

    /* ============================================
       STARS
       box-shadow starfield on a tiny div
    ============================================ */
    .stars {
      position: absolute;
      top: 0; left: 0;
      width: 1px;
      height: 1px;
      background: transparent;
      box-shadow:
        120px 40px 0 1px #fff, 250px 80px 0 1px #fff, 400px 30px 0 1px #fff,
        550px 60px 0 1px #fff, 700px 20px 0 1px #fff, 850px 90px 0 1px #fff,
        980px 50px 0 1px #fff, 60px 150px 0 1px #fff, 200px 130px 0 1px #fff,
        370px 170px 0 1px #fff, 500px 110px 0 1px #fff, 640px 155px 0 1px #fff,
        790px 140px 0 1px #fff, 900px 120px 0 1px #fff, 1050px 70px 0 1px #fff,
        1150px 40px 0 1px #fff, 1250px 100px 0 1px #fff, 1350px 55px 0 1px #fff,
        180px 200px 0 1px #ddd, 450px 220px 0 1px #ddd, 750px 210px 0 1px #ddd,
        30px 280px 0 1px #ddd, 320px 260px 0 1px #ddd, 600px 290px 0 1px #ddd,
        880px 270px 0 1px #ddd, 1100px 240px 0 1px #ddd;
      transition: opacity 0.8s;
    }

    body.day .stars {
      opacity: 0;
    }

    /* ============================================
       HINT TEXT
    ============================================ */
    .hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.35);
      font-family: sans-serif;
      font-size: 13px;
      letter-spacing: 1px;
      pointer-events: none;
      transition: color 0.8s;
    }

    body.day .hint {
      color: rgba(0,0,0,0.25);
    }

    /* ============================================
       THE BAT
       The entire bat is drawn using a single 1x1px
       div. Here's how the trick works:

       1. The div is 1px x 1px — invisible on its own
       2. box-shadow paints each pixel of the bat.
          Each shadow entry is:
            X-offset  Y-offset  blur  color
          e.g. "5px 3px 0 #222" = dark dot at x=5, y=3
          Since blur=0, each shadow is a sharp 1px dot.
          Hundreds of these together form the bat shape.

       3. transform: scale(4) blows the whole thing
          up 4x — so each 1px dot becomes a 4x4 block,
          giving it the chunky pixel-art look.

       4. position: relative with left/top: -128px
          re-centers the bat after scaling, since
          scale(4) on a 1px element offsets it.

       5. The animation swaps box-shadow between
          two frames (wings up / wings down) using
          steps(1) — which snaps instantly with no
          easing, giving the retro sprite-flip feel.
    ============================================ */
    .bat {
      width: 1px;
      height: 1px;
      position: absolute;
      -webkit-animation: 0.4s bat steps(1) infinite, fly 12s linear infinite;
              animation: 0.4s bat steps(1) infinite, fly 12s linear infinite;
    }

    /* tops kept between 20vh–70vh so bats stay off the edges */
    .bat:nth-child(1) {
      top: 22vh;
      animation-delay: 0s, 0s;
      transform: scale(4);
    }

    .bat:nth-child(2) {
      top: 38vh;
      animation-delay: 0.1s, -4s;
      transform: scale(3);
      filter: brightness(1.4);
    }

    .bat:nth-child(3) {
      top: 55vh;
      animation-delay: 0.2s, -8s;
      transform: scale(2.5);
    }

    .bat:nth-child(4) {
      top: 30vh;
      animation-delay: 0.15s, -2s;
      transform: scale(3.5);
    }

    .bat:nth-child(5) {
      top: 65vh;
      animation-delay: 0.05s, -10s;
      transform: scale(2);
      filter: brightness(0.8);
    }

    .bat:nth-child(6) {
      top: 45vh;
      animation-delay: 0.3s, -6s;
      transform: scale(4.5);
    }

    .bat:nth-child(7) {
      top: 20vh;
      animation-delay: 0.25s, -3s;
      transform: scale(2.2);
      filter: brightness(1.2);
    }

    @keyframes fly {
      0%   { left: calc(100vw + 200px); }
      100% { left: -200px; }
    }
